<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextBid — Notificações</title>
  <link rel="icon" href="../../img/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="../../img/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="../../img/favicon-192.png" />
  <link rel="stylesheet" href="../../css/main.css?v=11" />
</head>

<body class="page">

  <header class="navbar">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__brand">
        <img class="navbar__logo-img" src="../../img/logo-NextBid.png" alt="NextBid" />
        <span>NEXTBID</span>
      </a>
      <nav class="navbar__links">
        <a href="index.html" class="navbar__link">
          <span class="navbar__link-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg></span>Início
        </a>
        <a href="leiloes/LeiloesAtivos.html" class="navbar__link">
          <span class="navbar__link-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m14.5 12.5-8 8a2.12 2.12 0 1 1-3-3l8-8" />
              <path d="m16 16 6-6" />
              <path d="m8 8 6-6" />
              <path d="m9 7 8 8" />
              <path d="m21 11-8-8" />
            </svg></span>Leilões
        </a>
        <a href="leiloes/MeusLeiloes.html" class="navbar__link">
          <span class="navbar__link-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" />
              <path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" />
              <path d="M7 21h10" />
              <path d="M12 3v18" />
              <path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2" />
            </svg></span>Os Meus Leilões
        </a>
      </nav>
      <div class="navbar__auth" id="navbar-auth"></div>
    </div>
  </header>

  <div class="ticker">
    <div class="ticker__track" id="ticker-track"></div>
  </div>

  <main class="page__main">
    <div id="auth-content">
      <div class="page-header">
        <h1 class="page-header__title">Notificações</h1>
        <p class="page-header__sub">Mantém-te a par do que se passa nos teus leilões e favoritos</p>
      </div>

      <div class="notifications-page">
        <nav class="tabs" role="tablist">
          <button class="tab tab--active" data-tab="todas" role="tab" id="tab-todas">Todas (0)</button>
          <button class="tab" data-tab="favoritos" role="tab" id="tab-favoritos">Favoritos (0)</button>
        </nav>
      </div>

      <div class="notif-toolbar" id="notif-toolbar">
        <button class="btn btn--ghost btn--sm" id="btn-mark-all" disabled>Marcar todas como lidas</button>
      </div>

      <div class="notifications-page">
        <section id="panel-todas" class="tab-panel active">
          <div class="notif-list" id="notif-list">
            <div class="notif-empty">
              <div class="notif-empty__icon">⏳</div>
              <p class="notif-empty__title">A carregar…</p>
            </div>
          </div>
        </section>

        <section id="panel-favoritos" class="tab-panel">
          <div class="auctions-grid auctions-grid--cols-3" id="grid-favoritos">
            <div class="cards-loading">
              <div class="spinner"></div>
              <p>A carregar favoritos…</p>
            </div>
          </div>
        </section>
      </div>
    </div>

    <div class="login-prompt" id="login-prompt" style="display:none">
      <h2>Sessão Necessária</h2>
      <p>Inicia sessão para ver as tuas notificações.</p>
      <a href="../auth/Login.html" class="btn btn--primary">Iniciar Sessão</a>
    </div>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <p class="footer__copy">© 2026 NextBid. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script src="../../js/shared/Helpers.js?v=8"></script>
  <script src="../../js/shared/Auth.js?v=8"></script>
  <script src="../../js/components/wallet/Wallet.js?v=8"></script>
  <script src="../../js/components/favorite-button/FavoriteButton.js?v=8"></script>
  <script src="../../js/components/notification-bell/NotificationBell.js?v=8"></script>
  <script src="../../js/components/navbar/Navbar.js?v=8"></script>
  <script src="../../js/components/cronometro/Cronometro.js?v=10"></script>
  <script src="../../js/components/ticker/Ticker.js?v=8"></script>
  <script src="../../js/components/auction-card/AuctionCard.js?v=8"></script>
  <script src="../../js/pages/Notificacoes.js?v=8"></script>
</body>

</html>
