resolver 127.0.0.11 valid=5s ipv6=off;

# Afinidade de sessão (sticky): cada browser fica sempre no mesmo servidor enquanto ele estiver
# vivo. O browser guarda um identificador aleatório no cookie "nb_sticky" (Helpers.js) e o Nginx
# escolhe o servidor a partir dele (hash consistente). Se esse servidor cair, o pedido passa para
# o outro; quando voltar, o mesmo cookie leva o browser de volta ao servidor original.
# Pedidos sem cookie (ex.: botão "Enviar 30 pedidos" da página /estado, curl) usam um valor
# aleatório por pedido, por isso continuam a ser repartidos pelos dois servidores.
map $cookie_nb_sticky $nb_sticky_key {
    ""      $request_id;
    default $cookie_nb_sticky;
}

upstream nextbid_api {
    zone nextbid_api 64k;
    hash $nb_sticky_key consistent;
    # Deteção passiva de falhas: 1 erro e a instância fica de fora 10 s.
    server api1:3000 resolve max_fails=1 fail_timeout=10s;
    server api2:3000 resolve max_fails=1 fail_timeout=10s;
    keepalive 32;
}

# Limite de tentativas de login por IP (segurança: dificulta ataques de força bruta)
limit_req_zone $binary_remote_addr zone=nextbid_auth:10m rate=5r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;

    client_max_body_size 80m;   # até 15 fotos de 5 MB por leilão
    server_tokens off;

    # Redirecionamentos relativos. Sem isto, o Nginx (que dentro do contentor ouve na porta 80)
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Se nenhuma instância da API responder, devolve JSON em vez da página HTML do Nginx:
    # o frontend faz res.json() a todas as respostas e mostraria "Erro de rede".
    error_page 502 504 = @api_indisponivel;
    location @api_indisponivel {
        default_type application/json;
        return 503 '{"status":"error","message":"Serviço temporariamente indisponível. Tenta novamente dentro de instantes."}';
    }

    location = / {
        return 302 /frontend/html/pages/index.html;
    }

    # Página "Arquitetura ao vivo"
    location = /estado {
        return 302 /frontend/html/pages/Estado.html;
    }

    # Health de UMA instância específica (sem balanceamento), para a página /estado mostrar
    # cada API em separado.
    location ~ ^/_inst/(api[12])/health$ {
        set $inst $1;
        proxy_pass http://$inst:3000/api/health;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        add_header Cache-Control no-store always;
    }

    location /frontend/ {
        alias /usr/share/nginx/html/frontend/;
        # Sem cache no browser: o frontend está em desenvolvimento e uma alteração tem de
        # aparecer logo (o Nginx continua a responder 304 quando o ficheiro não mudou).
        expires -1;
    }

    # Imagens dos dados de demonstração (infra/seed-uploads/, só leitura)
    location /backend/uploads/seed/ {
        alias /data/seed/;
        expires 7d;
    }

    location /backend/uploads/ {
        alias /data/uploads/;
        expires 1h;
        # só imagens; nada é executado a partir daqui
        location ~* \.(php|js|html?)$ { return 403; }
    }

    location ~ ^/(backend/)?api/auth/ {
        limit_req zone=nextbid_auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/nextbid_proxy.inc;
    }

    location /backend/api/ {
        include /etc/nginx/conf.d/nextbid_proxy.inc;
    }

    location /api/ {
        include /etc/nginx/conf.d/nextbid_proxy.inc;
    }

    location /socket.io/ {
        proxy_pass http://nextbid_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        add_header X-Servido-Por $upstream_addr always;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
